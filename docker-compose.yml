version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: ai-interview-mongo
    environment:
      MONGO_INITDB_DATABASE: ai_interview_system
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ai-interview-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-interview-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-interview-backend
    environment:
      MONGODB_URL: mongodb://mongo:27017
      DATABASE_NAME: ai_interview_system
      SECRET_KEY: your-super-secret-key-minimum-32-characters-long
      REDIS_URL: redis://redis:6379
      ADMIN_FRONTEND_URL: http://localhost:3000
      CANDIDATE_FRONTEND_URL: http://localhost:3001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-interview-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Admin Frontend
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: ai-interview-admin
    ports:
      - "3000:3000"
    volumes:
      - ./admin-frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - ai-interview-network

  # Candidate Frontend
  candidate-frontend:
    build:
      context: ./candidate-frontend
      dockerfile: Dockerfile
    container_name: ai-interview-candidate
    ports:
      - "3001:3001"
    volumes:
      - ./candidate-frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - ai-interview-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-interview-network:
    driver: bridge
